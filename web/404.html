<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · Magpie</title>
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: #0b0c0e;
        background: #fbfbfc;
      }

      main {
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 3rem;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 1.5rem;
        color: #5b6067;
      }

      a {
        color: #0f766e;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #ededf0;
          background: #08080a;
        }

        p {
          color: #9ba1a9;
        }

        a {
          color: #5eead4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>这个页面不存在，可能已被移动或删除。</p>
      <a id="home" href="/">返回首页</a>
    </main>
    <script>
      const isProjectPage = location.hostname.endsWith(".github.io");
      const segment = location.pathname.split("/").filter(Boolean)[0];
      document.querySelector("#home").href = isProjectPage && segment ? "/" + segment + "/" : "/";
    </script>
  </body>
</html>
