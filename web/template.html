<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{TITLE}}" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" id="theme-color" content="#fbfbfc" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <!-- 首屏前确定主题，避免深色偏好用户看到闪白 -->
    <script src="./assets/theme.js"></script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到内容</a>

    <header class="hdr" id="hdr">
      <div class="hdr-in">
        <a class="brand" href="./" aria-label="{{TITLE}} 首页">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8.5" fill="var(--ink)" />
            <path
              d="M10.2 21.2V11l5.8 5.8L21.8 11v10.2"
              fill="none"
              stroke="var(--bg)"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="24.4" cy="8.6" r="2" fill="var(--accent)" />
          </svg>
          <span>{{TITLE}}</span>
        </a>
        <span class="hdr-sep" aria-hidden="true"></span>
        <span class="running" id="running" aria-hidden="true"></span>
        <div class="hdr-tools">
          <button
            class="icon-btn"
            id="theme"
            type="button"
            aria-label="深色主题"
            aria-pressed="false"
          >
            <svg
              class="i-sun"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              aria-hidden="true"
            >
              <circle cx="8" cy="8" r="3.2" />
              <path
                d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M2.8 2.8l1.1 1.1M12.1 12.1l1.1 1.1M13.2 2.8l-1.1 1.1M3.9 12.1l-1.1 1.1"
                stroke-linecap="round"
              />
            </svg>
            <svg
              class="i-moon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              aria-hidden="true"
            >
              <path
                d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div class="search">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="7" cy="7" r="4.4" />
              <path d="m10.4 10.4 3 3" stroke-linecap="round" />
            </svg>
            <label class="sr-only" for="q">搜索条目</label>
            <input
              id="q"
              type="search"
              placeholder="搜索 {{COUNT}} 个条目…"
              autocomplete="off"
              spellcheck="false"
              aria-keyshortcuts="/"
              enterkeyhint="search"
            />
            <button class="search-clear" id="clear" type="button" aria-label="清除搜索" hidden>
              ×
            </button>
            <kbd aria-hidden="true">/</kbd>
          </div>
        </div>
      </div>
    </header>

    <section class="mast" id="top">
      <div class="mast-in">
        <p class="eyebrow">人工策展 · 每周更新</p>
        <h1 id="page-title">
          把散落各处的 AI 工具<br /><span class="dim">收进一份能用的清单</span>
        </h1>
        <p class="lede">{{DESCRIPTION}}</p>
      </div>
    </section>

    <div class="wrap">
      <aside class="rail">
        <nav aria-label="章节导航">{{NAV}}</nav>
      </aside>

      <main class="content" id="main" tabindex="-1" aria-labelledby="page-title">
        <p class="sr-only" id="sr-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="empty" id="empty" hidden>
          <p>没有匹配「<span id="empty-q"></span>」的条目</p>
          <button class="empty-btn" id="empty-clear" type="button">清空搜索</button>
        </div>
        {{BODY}}
      </main>
    </div>

    <footer class="ftr">
      <div class="ftr-in">
        <div>
          <div class="ftr-brand">
            <svg class="ftr-mark" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="8.5" fill="var(--ink)" />
              <path
                d="M10.2 21.2V11l5.8 5.8L21.8 11v10.2"
                fill="none"
                stroke="var(--bg)"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="24.4" cy="8.6" r="2" fill="var(--accent)" />
            </svg>
            <span>{{TITLE}}</span>
          </div>
          <p class="ftr-tag">{{TAGLINE}}</p>
          <p class="ftr-note">{{CONTRIBUTING}}</p>
        </div>
        <nav class="ftr-links" aria-label="相关链接">
          <a href="{{REPO_URL}}">{{REPO}}</a>
          <a href="{{REPO_URL}}/blob/main/LICENSE">{{LICENSE}}</a>
        </nav>
        <div class="ftr-meta">
          <span>{{SECTION_COUNT}} 个章节</span>
          <span>{{COUNT}} 个条目</span>
          <span>内容维护在 data/</span>
        </div>
      </div>
    </footer>

    <button class="back-top" id="back-top" type="button" aria-label="回到顶部">
      <svg
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="M8 12.5v-9M4.2 7.3 8 3.5l3.8 3.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
