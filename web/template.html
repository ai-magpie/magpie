<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{TITLE}}" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">跳到内容</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="./">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="var(--mark-bg)" />
            <path
              d="M17 45c11-1 19-9 23-24 3 13-1 24-11 29-5 3-10 1-12-5Z"
              fill="var(--mark-body)"
            />
            <circle cx="41" cy="20" r="4.5" fill="var(--mark-eye)" />
          </svg>
          <span class="brand-text">
            {{TITLE}}
            <span class="brand-tag">{{TAGLINE}}</span>
          </span>
        </a>
        <div class="search">
          <label class="sr-only" for="q">搜索条目</label>
          <input
            id="q"
            type="search"
            placeholder="搜索工具或描述…"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-clear" id="clear" type="button" aria-label="清除搜索" hidden>
            ×
          </button>
          <kbd aria-hidden="true">/</kbd>
        </div>
      </div>
    </header>

    <nav class="section-nav wrap" aria-label="章节">{{NAV}}</nav>

    <main id="content" class="wrap">
      <p class="count" id="count" aria-live="polite">共 {{COUNT}} 个条目</p>
      <p class="empty-state" id="empty" hidden>没有匹配的条目，试试更短的关键词。</p>
      {{BODY}}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="footer-brand">
          <svg class="footer-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="var(--mark-bg)" />
            <path
              d="M17 45c11-1 19-9 23-24 3 13-1 24-11 29-5 3-10 1-12-5Z"
              fill="var(--mark-body)"
            />
            <circle cx="41" cy="20" r="4.5" fill="var(--mark-eye)" />
          </svg>
          <span>{{TITLE}}</span>
        </div>
        <ul class="footer-meta">
          <li><a href="{{REPO_URL}}">{{REPO}}</a></li>
          <li>{{LICENSE}} License</li>
          <li>{{SECTION_COUNT}} 个章节 · {{COUNT}} 个条目</li>
          <li>内容维护在 <code>data/</code>，欢迎提交 PR</li>
        </ul>
      </div>
    </footer>

    <button class="back-top" id="backTop" type="button" aria-label="回到顶部" aria-hidden="true">
      ↑
    </button>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
